<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cripto Breaker API</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
        }
        h1 { margin-top: 0; color: #4CAF50; text-align: center; }
        p { text-align: center; color: #aaaaaa; margin-bottom: 30px; }
        textarea {
            width: 100%;
            height: 120px;
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: monospace;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #888; cursor: not-allowed; }
        #resultado {
            margin-top: 20px;
            padding: 20px;
            background-color: #2d2d2d;
            border-left: 4px solid #4CAF50;
            border-radius: 4px;
            display: none;
            word-wrap: break-word;
            line-height: 1.5;
        }
        .error { border-left-color: #f44336 !important; color: #ff8a80; }
        .link-docs { text-align: center; margin-top: 20px; display: block; color: #888; text-decoration: none; font-size: 14px; }
        .link-docs:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔓 Cripto Breaker</h1>
        <p>Pega tu texto cifrado y el algoritmo intentará romperlo.</p>
        
        <textarea id="textoCifrado" placeholder="Ejemplo: Krod Pxqgr"></textarea>
        <button onclick="romperCifrado()" id="btnRomper">Descifrar Texto</button>

        <div id="resultado"></div>
        <a href="/docs" class="link-docs">Ver documentación de la API (Swagger)</a>
    </div>

    <script>
        async function romperCifrado() {
            const texto = document.getElementById('textoCifrado').value;
            const resultadoDiv = document.getElementById('resultado');
            const boton = document.getElementById('btnRomper');

            if (!texto.trim()) {
                resultadoDiv.style.display = 'block';
                resultadoDiv.className = 'error';
                resultadoDiv.innerHTML = '⚠️ Por favor, ingresa un texto para descifrar.';
                return;
            }

            boton.innerText = 'Analizando... (puede tardar si el servidor está despertando)';
            boton.disabled = true;
            resultadoDiv.style.display = 'none';

            try {
                const respuesta = await fetch('/romper', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto: texto })
                });

                const datos = await respuesta.json();

                resultadoDiv.style.display = 'block';
                resultadoDiv.className = ''; 

                if (datos.exito) {
                    resultadoDiv.innerHTML = `
                        <strong>✅ Método detectado:</strong> ${datos.metodo_detectado}<br><br>
                        <strong>Texto descifrado:</strong><br>
                        <span style="font-size: 1.2em; color: #4CAF50;">${datos.texto_descifrado}</span>
                    `;
                } else {
                    resultadoDiv.className = 'error';
                    resultadoDiv.innerHTML = `❌ Error: ${datos.detail || 'No se pudo descifrar.'}`;
                }
            } catch (error) {
                resultadoDiv.style.display = 'block';
                resultadoDiv.className = 'error';
                resultadoDiv.innerHTML = '❌ Error de conexión. El servidor gratuito se duerme tras 15 min inactivo. Recarga la página y espera 40 segundos.';
            } finally {
                boton.innerText = 'Descifrar Texto';
                boton.disabled = false;
            }
        }
    </script>
</body>
</html>
